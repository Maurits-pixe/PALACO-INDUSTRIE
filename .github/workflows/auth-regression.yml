name: Authentication regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Root application files, tests, and distribution modules.
          # Avoid imported historical snapshots with overlong filenames.
          sparse-checkout: |
            tests
            distribution
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm test
