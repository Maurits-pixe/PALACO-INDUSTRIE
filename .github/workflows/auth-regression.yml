name: Authentication regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Root application files, tests, and distribution modules.
          # Avoid imported historical snapshots with overlong filenames.
          sparse-checkout: |
            tests
            distribution
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm test

  postgres-continuity-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: palaco_ci
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: palaco_continuity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U palaco_ci -d palaco_continuity_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PALACO_TEST_POSTGRES: "1"
      PALACO_TEST_DATABASE_URL: postgresql://palaco_ci:local_ci_only@127.0.0.1:5432/palaco_continuity_ci
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tests
            distribution
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Only the disposable CI job installs a test driver; production
      # runtime dependencies and lockfiles are unchanged.
      - run: npm install --no-save --no-package-lock --ignore-scripts pg@8.16.3
      - run: node --test tests/postgres-live-continuity.test.js
      - name: Verify durable independent authority anchor anti-replay
        run: node --test tests/postgres-authority-anchor.test.js
      - name: Detect restored authority database against secondary witness
        run: node --test tests/postgres-dual-authority-witness.test.js
      - name: Verify signed external checkpoint against PostgreSQL rollback
        run: node --test tests/postgres-checkpoint-verification.test.js
      - name: Verify strict checkpoint gate for SQLite issue and consume
        run: node --test tests/postgres-checkpoint-strict-execution.test.js
      - name: Reject restored SQLite backup against independent PostgreSQL witness
        run: node --test tests/postgres-independent-rollback-rejection.test.js
      - name: Test restricted PostgreSQL runtime role
        run: node --test tests/postgres-runtime-privileges.test.js
      - name: Test restricted authority anchor runtime role
        run: node --test tests/postgres-authority-anchor-privileges.test.js
      - name: Prepare persistent authority head before crash
        env:
          PALACO_TEST_PHASE: prepare
        run: node --test tests/postgres-authority-anchor-crash-recovery.test.js
      - name: Prepare committed continuity high-watermark
        env:
          PALACO_TEST_PHASE: prepare
        run: node --test tests/postgres-crash-recovery.test.js
      - name: Abruptly terminate and restart isolated PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(docker ps --filter "ancestor=postgres:17" --format '{{.ID}}')
          test "${#ids[@]}" -eq 1
          docker kill --signal=KILL "${ids[0]}"
          docker start "${ids[0]}"
          ready=0
          for attempt in $(seq 1 45); do
            if pg_isready -h 127.0.0.1 -p 5432 -U palaco_ci -d palaco_continuity_ci >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Verify recovery and reject regression
        env:
          PALACO_TEST_PHASE: verify
        run: node --test tests/postgres-crash-recovery.test.js
      - name: Verify durable authority head after abrupt PostgreSQL restart
        env:
          PALACO_TEST_PHASE: verify
        run: node --test tests/postgres-authority-anchor-crash-recovery.test.js
